name: FelixFeeds
options:
  bundleIdPrefix: com.jonbright
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
packages:
  FeedingCore:
    path: Core
configFiles:
  Debug: Config/Local.xcconfig
  Release: Config/Local.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    FELIX_APNS_ENVIRONMENT: development
    FELIX_REMOTE_TIMER_UPDATES: "NO"
    FELIX_APP_ENTITLEMENTS: ""
    FELIX_WIDGET_ENTITLEMENTS: ""
targets:
  FelixFeeds:
    type: application
    platform: iOS
    sources: [App, Shared, Core/Sources/FeedingCore/Resources]
    dependencies:
      - package: FeedingCore
      - target: FeedingLiveActivity
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonbright.FelixFeeds
        PRODUCT_NAME: FelixFeeds
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/AppInfo.plist
        INFOPLIST_KEY_CFBundleDisplayName: Felix Feeds
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        MARKETING_VERSION: "1.9"
        CURRENT_PROJECT_VERSION: "27"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: $(FELIX_APP_ENTITLEMENTS)
  FeedingLiveActivity:
    type: app-extension
    platform: iOS
    sources: [LiveActivity, Shared, Core/Sources/FeedingCore/Resources]
    dependencies:
      - package: FeedingCore
    info:
      path: LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Feeding timer
        FelixActivityKeychainGroup: $(AppIdentifierPrefix)com.jonbright.FelixFeeds.activity-display
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonbright.FelixFeeds.LiveActivity
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.9"
        CURRENT_PROJECT_VERSION: "27"
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: $(FELIX_WIDGET_ENTITLEMENTS)
  LiveActivityTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests, Shared]
    dependencies:
      - package: FeedingCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.FelixFeeds.ActivityTests
schemes:
  FelixFeeds:
    build:
      targets:
        FelixFeeds: all
    test:
      targets: [LiveActivityTests]
