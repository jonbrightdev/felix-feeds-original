name: Checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install build and scan tools
        run: brew install xcodegen gitleaks
      - name: Scan committed history for secrets
        run: gitleaks git --redact --no-banner .
      - name: Generate project
        run: bash scripts/setup.sh
      - name: Test domain and persistence
        run: swift test --package-path Core --scratch-path "$RUNNER_TEMP/felix-feeds-core"
      - name: Build for iOS Simulator
        run: >-
          xcodebuild -quiet -project FelixFeeds.xcodeproj -scheme FelixFeeds
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/felix-feeds-build"
          CODE_SIGNING_ALLOWED=NO build
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm test && npm run build && npm run validate
        working-directory: Backend
